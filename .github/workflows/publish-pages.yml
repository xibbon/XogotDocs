name: Trigger Combined Docs Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "combined-docs-dispatch"
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger XogotDocs-i18n deployment
        env:
          DISPATCH_TOKEN: ${{ secrets.XOGOTDOCS_I18N_DISPATCH_TOKEN }}
          XOGOT_SHA: ${{ github.sha }}
          XOGOT_REF: ${{ github.ref_name }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "Missing XOGOTDOCS_I18N_DISPATCH_TOKEN secret."
            exit 1
          fi

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/xibbon/XogotDocs-i18n/dispatches \
            -d "{\"event_type\":\"xogotdocs-push\",\"client_payload\":{\"sha\":\"${XOGOT_SHA}\",\"ref\":\"${XOGOT_REF}\"}}"
